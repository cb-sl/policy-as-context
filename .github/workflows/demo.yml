name: Run Policy as Context demo

# Runs the demo in the cloud so the mechanic is reproducible without a local
# setup. Triggers on push to main and on a manual button click (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the demo
        run: python demo.py

      - name: Upload generated configs and audit records
        uses: actions/upload-artifact@v4
        with:
          name: policy-as-context-output
          path: |
            configs/**/routing.yaml
            audit/*.json
          if-no-files-found: error
